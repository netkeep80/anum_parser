name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/configure-pages@v6
      - name: Материализовать exact accepted @mts/core
        run: npm run mts:prepare
      - name: Собрать статический сайт
        run: |
          mkdir _site
          cp index.html styles.css package.json _site/
          cp -R src examples docs generated _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v5
