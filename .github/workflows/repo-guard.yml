name: repo-guard policy check

on:
  pull_request:
    types: [opened, synchronize]
    branches: ["**"]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  policy-check:
    name: repo-guard blocking check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run repo-guard
        id: repo_guard
        uses: netkeep80/repo-guard@03e24a781f024ab1c91e79678737fe4ded743d48
        with:
          mode: check-pr
          enforcement: blocking
          node-version: 24
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish repo-guard summary
        if: always()
        run: |
          echo "repo-guard result: ${{ steps.repo_guard.outputs.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.repo_guard.outputs.summary }}" >> "$GITHUB_STEP_SUMMARY"
