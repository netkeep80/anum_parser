name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Prepare exact runtime and browser dependencies
        run: npm run deps:prepare
      - name: Syntax checks
        run: npm run check:prepared
      - name: Unit tests
        run: npm run test:prepared
      - name: Verify accepted @mts/core consumer lock
        run: node scripts/verify-mts-core-consumer.mjs
      - name: Reproducible site build
        run: npm run site:build

  browser-acceptance:
    name: Browser acceptance (_site / Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run deps:prepare
      - run: npm run site:build
      - run: npm run browser:install
      - run: npm run test:browser
      - name: Publish browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-evidence
          path: test-results/browser
          if-no-files-found: ignore
          retention-days: 7
