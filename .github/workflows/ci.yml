name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run site:build

  browser-acceptance:
    name: Browser acceptance (_site / Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run deps:prepare
      - run: npm run site:build
      - run: npm run browser:install
      - run: npm run test:browser
      - name: Publish browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: test-results/browser
          if-no-files-found: ignore
          retention-days: 7

  mts-core-consumer:
    name: Verify accepted @mts/core consumer lock
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Materialize exact runtime for local differential adapter
        run: npm run mts:prepare
      - name: Rebuild, digest and consume exact @mts/core artifact
        run: node scripts/verify-mts-core-consumer.mjs
