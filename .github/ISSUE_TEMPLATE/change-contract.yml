name: Предложение изменения
description: Опишите потребность и наблюдаемые критерии приёмки без специальных управляющих grants.
title: "[change] "
body:
  - type: textarea
    id: objective
    attributes:
      label: Проблема или цель
      description: Что и зачем требуется изменить?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Проверяемый результат
      description: Какие наблюдения или тесты подтвердят результат?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Контекст и ограничения
      description: Ссылки на требования, связанные решения и риски.
    validations:
      required: false
